databases:
  - name: plotchain-db
    databaseName: plotchain
    user: plotchain
    plan: free

services:
  - type: web
    name: plotchain-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PLOTCHAIN_SECRETS_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://plotchain-frontend.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: plotchain-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: plotchain-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: plotchain-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: plotchain-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: plotchain-db
          property: password

  - type: web
    name: plotchain-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://plotchain-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
