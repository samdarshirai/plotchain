databases:
  - name: plotchain
    databaseName: plotchain
    user: plotchain
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: plotchain-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PLOTCHAIN_SECRETS_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.virajacres.com
      - key: DB_HOST
        fromDatabase:
          name: plotchain
          property: host
      - key: DB_PORT
        fromDatabase:
          name: plotchain
          property: port
      - key: DB_NAME
        fromDatabase:
          name: plotchain
          property: database
      - key: DB_USER
        fromDatabase:
          name: plotchain
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: plotchain
          property: password

  - type: web
    name: plotchain-frontend
    runtime: static
    rootDir: frontend
    buildFilter:
      paths:
        - frontend/**
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://api.virajacres.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
