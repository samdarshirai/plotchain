spring:
  # @DataJpaTest otherwise swaps in a plain embedded H2 (no MODE=PostgreSQL) that rejects
  # Postgres-only migration syntax such as V64's "CREATE SEQUENCE ... START 1".
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:plotchain;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-at-least-32-bytes-long-for-hs256
  expiration-minutes: 60
