name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless --progress=false

  e2e:
    # Playwright table/mobile suite against the real stack: Postgres + backend jar + ng serve (proxies /api to :8081).
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: plotchain
          POSTGRES_PASSWORD: plotchain
          POSTGRES_DB: plotchain
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U plotchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start backend
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          export JWT_SECRET=$(openssl rand -base64 48)
          export PLOTCHAIN_SECRETS_KEY=$(openssl rand -base64 32)
          nohup java -jar target/*.jar > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8081/api/auth/login && exit 0; sleep 2; done
          cat ../backend.log; exit 1
      - name: Install frontend and start dev server
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npx ng serve --port 4200 > ../frontend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null localhost:4200 && exit 0; sleep 2; done
          cat ../frontend.log; exit 1
      - name: Mark company launched
        # Fresh DB is pre-launch, so every route redirects to the setup wizard; the specs need a live company.
        run: PGPASSWORD=plotchain psql -h localhost -p 5434 -U plotchain plotchain -c "UPDATE setup_state SET launched_at = now(), terms_accepted_at = now()"
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            frontend/test-results
            backend.log
            frontend.log
